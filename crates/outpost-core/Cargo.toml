[package]
name = "outpost-core"
description = "Outpost Mail core: all mail work, behind one command-and-event interface."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
mail-parser = "1"
ammonia = "4"
mail-builder = "2"
# The operating system's credential store.
keyring = "4"
# IMAP parsing and serialising. An alpha series whose API moves between
# releases: pinned exactly, upgraded deliberately. See docs/imap-library-evaluation.md.
imap-codec = { version = "=2.0.0-alpha.10", features = ["ext_condstore_qresync", "ext_id", "ext_list_extended"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"
# Hashing the settings password. Already in the build through rustls.
ring = "0.17"
# Phase two: calendars, tasks and contacts.
# Reading iCalendar and vCard files and expanding repeating events.
calcard = { version = "0.3", default-features = false }
# Reading WebDAV's XML answers.
quick-xml = "0.42"
# Reading HTTP response headers.
httparse = "1"
# Dates and time zones, as calcard uses them (already in the build with it).
chrono = { version = "0.4", default-features = false }
chrono-tz = { version = "0.10", default-features = false }
# The name of this computer's time zone (already in the build with chrono).
iana-time-zone = "0.1"
# DKIM signature re-checks. Pure-Rust cryptography (no C toolchain needed),
# and the system's own DNS settings for looking up signing keys.
mail-auth = { version = "0.15", default-features = false, features = ["rust-crypto", "dns-hickory"] }
