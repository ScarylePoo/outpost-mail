name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      # The sync tests start their own private Dovecot. Without this they
      # would report themselves skipped; on Linux CI that must be a failure.
      - name: Dovecot for the sync tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y dovecot-imapd openssl
          /usr/sbin/dovecot --version
          echo "OUTPOST_REQUIRE_DOVECOT=1" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Core tests
        run: cargo test

      - name: Interface type-check and build
        run: |
          npm ci
          npm run build -w ui

      - name: Shell builds
        run: cargo build -p outpost-shell-tauri
